# NIST 800-53 AU Family: Audit and Accountability
controls:
  - id: au-1
    title: Policy and Procedures
    levels:
      - low
      - moderate
      - high
    rules: []
    status: pending
  - id: au-2
    title: Event Logging
    levels:
      - low
      - moderate
      - high
    rules:
      - var_audit_backlog_limit=8192
      {{% if product == "rhel9" %}}
      - var_auditd_action_mail_acct=root
      {{% endif %}}
      {{% if product == "rhel10" %}}
      - var_auditd_admin_space_left_action=cis_rhel10
      {{% elif product == "rhel8" %}}
      - var_auditd_admin_space_left_action=cis_rhel8
      {{% elif product == "rhel9" %}}
      - var_auditd_admin_space_left_action=cis_rhel9
      {{% endif %}}
      {{% if product == "rhel9" %}}
      - var_auditd_disk_error_action=cis_rhel9
      - var_auditd_disk_full_action=cis_rhel9
      {{% endif %}}
      {{% if product == "rhel10" %}}
      - var_auditd_space_left_action=cis_rhel10
      {{% elif product == "rhel8" %}}
      - var_auditd_space_left_action=cis_rhel8
      {{% elif product == "rhel9" %}}
      - var_auditd_space_left_action=cis_rhel9
      {{% endif %}}
      - aide_build_database
      - aide_periodic_cron_checking
      - audit_rules_execution_chacl
      - audit_rules_execution_chcon
      - audit_rules_execution_setfacl
      - audit_rules_privileged_commands_usermod
      - auditd_data_disk_error_action
      - auditd_data_disk_full_action
      {{% if product == "rhel9" %}}
      - auditd_data_retention_action_mail_acct
      {{% endif %}}
      - auditd_data_retention_admin_space_left_action
      - auditd_data_retention_space_left_action
      - grub2_audit_backlog_limit_argument
      {{% if product in ["rhel10", "rhel8"] %}}
      - journald_disable_forward_to_syslog
      {{% endif %}}
      - package_aide_installed
      - package_audit-libs_installed
      - package_audit_installed
      - package_systemd-journal-remote_installed
      {{% if product == "rhel8" %}}
      - rsyslog_nolisten
      {{% endif %}}
      - service_auditd_enabled
      {{% if product == "rhel8" %}}
      - service_rsyslog_enabled
      {{% endif %}}
      {{% if product in ["rhel10", "rhel8"] %}}
      - service_systemd-journal-upload_enabled
      {{% endif %}}
      - service_systemd-journald_enabled
      - socket_systemd-journal-remote_disabled
    status: automated
  - id: au-2.1
    title: Compilation of Audit Records from Multiple Sources
    rules: []
    status: pending
  - id: au-2.2
    title: Selection of Audit Events by Component
    rules: []
    status: pending
  - id: au-2.3
    title: Reviews and Updates
    rules: []
    status: pending
  - id: au-2.4
    title: Privileged Functions
    rules: []
    status: pending
  - id: au-3
    title: Content of Audit Records
    description: 'Ensure that audit records contain information that establishes the following:'
    levels:
      - low
      - moderate
      - high
    rules:
      - sshd_max_auth_tries_value=4
      - sysctl_net_ipv4_conf_all_log_martians_value=enabled
      - sysctl_net_ipv4_conf_default_log_martians_value=enabled
      - var_accounts_passwords_pam_faillock_dir=run
      - var_multiple_time_servers=rhel
      - audit_rules_dac_modification_chmod
      - audit_rules_dac_modification_chown
      - audit_rules_dac_modification_fchmod
      - audit_rules_dac_modification_fchmodat
      - audit_rules_dac_modification_fchown
      - audit_rules_dac_modification_fchownat
      - audit_rules_dac_modification_fremovexattr
      - audit_rules_dac_modification_fsetxattr
      - audit_rules_dac_modification_lchown
      - audit_rules_dac_modification_lremovexattr
      - audit_rules_dac_modification_lsetxattr
      - audit_rules_dac_modification_removexattr
      - audit_rules_dac_modification_setxattr
